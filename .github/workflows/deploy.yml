name: Deploy CDK Stack

on:
  workflow_dispatch: # for manual deployment
  push:
    branches:
      - main
      - feat/processInstagramIds

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.REGION }}

      - name: Install Python dependencies for Lambda
        run: |
          cd lambda/dequeue-instagram-id
          pip install -r requirements.txt --target .
      # - name: Install Node.js dependencies for Lambda
      #   run: |
      #     cd lambda/selenium
      #     npm ci
      - name: CDK Deploy
        run: npx cdk deploy --require-approval never
        env:
          LINK_PREVIEW_API_KEY: ${{ secrets.LINK_PREVIEW_API_KEY }}
          LINK_PREVIEW_API_URL: ${{ vars.LINK_PREVIEW_API_URL }}
