name: Deploy CDK Stack

on:
  workflow_dispatch: # for manual deployment
  push:
    branches:
      - main
      - feat/processInstagramIds

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.REGION }}

      # Must match the Lambda runtime (python3.10): the runner's default Python
      # pulls wrong compiled wheels and skips 3.10-only deps like exceptiongroup.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies for Lambda
        run: |
          cd lambda/dequeue-instagram-id
          pip install -r requirements.txt --target .
      # - name: Install Node.js dependencies for Lambda
      #   run: |
      #     cd lambda/selenium
      #     npm ci
      - name: CDK Deploy
        # Fail instead of deploying dequeue with blank keys (the stack falls back to "").
        run: |
          test -n "$ANTHROPIC_API_KEY" && test -n "$TYPESAFE_API_KEY" || { echo "missing ANTHROPIC_API_KEY/TYPESAFE_API_KEY secret"; exit 1; }
          npx cdk deploy --require-approval never
        env:
          LINK_PREVIEW_API_KEY: ${{ secrets.LINK_PREVIEW_API_KEY }}
          LINK_PREVIEW_API_URL: ${{ vars.LINK_PREVIEW_API_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
